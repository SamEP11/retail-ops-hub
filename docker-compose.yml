# Entorno local completo: docker compose up --build
# API:      http://localhost:8000/docs
# Postgres: localhost:5432 (postgres/postgres)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail_ops
    ports:
      - "${DB_PORT:-5432}:5432"   # si 5432 está ocupado: DB_PORT=5433 en .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Sin "ports": la API lo usa por la red interna de Docker (redis:6379),
    # así no choca con otro Redis que tengas corriendo en tu PC.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/retail_ops
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/retail_ops_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --reload + volumen: cambias el código y la API se reinicia sola
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  # Panel web en modo desarrollo (Vite con recarga en caliente): http://localhost:5173
  # Para producción se usa frontend/Dockerfile (build + nginx).
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_POLLING: "true"  # en Windows los cambios de archivos no llegan sin polling
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules  # los node_modules de Linux no pisan los de tu PC
    depends_on:
      - api

volumes:
  web_node_modules:
  pgdata:
