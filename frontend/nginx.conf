server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # importación de catálogo: 5 MB + margen

    # La API vive en otro contenedor; el navegador ve un solo origen (sin CORS).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Archivos con hash en el nombre: se pueden cachear un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta (/productos/5) devuelve index.html y React Router decide.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
